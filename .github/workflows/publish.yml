# Written by `dialecte ci sync` from the @dialecte/cli template: change the template, not this file.
name: publish

# npm trusted publishing names this file (publish.yml) and its push trigger in every package: never rename it, never
# change its trigger, or publishing stops.
# The push to main is the queue's merge of a commit ci.yml already tested: build, then publish and tag when the
# version changed. No test runs here. Only the push that changes the version publishes it, above npm's latest, and
# tags it; a re-run pushes a missing tag alone (_check-npm-version.yml). No concurrency group: every push runs to its
# end, a pending run is never replaced by a later one's.
on:
  push:
    branches:
      - main

jobs:
  install:
    name: Install Dependencies
    uses: ./.github/workflows/_install.yml

  build:
    name: Build Project
    needs: install
    uses: ./.github/workflows/_build.yml

  version:
    name: Check Version
    needs: install
    uses: ./.github/workflows/_check-npm-version.yml

  extract-version:
    name: Extract Version
    uses: ./.github/workflows/_extract-version.yml

  deploy:
    name: Publish to NPM
    if: needs.version.outputs.publish == 'true'
    needs:
      - build
      - version
    uses: ./.github/workflows/_publish.yml
    with:
      dist-tag: ${{ needs.version.outputs.dist_tag }}

  create-release-tag:
    name: Create Release Tag
    # after the publish, or alone when the publish is skipped (npm has the version, its tag is missing); never after a
    # failed or cancelled job
    if: ${{ !cancelled() && !failure() && needs.version.outputs.tag == 'true' }}
    needs:
      - version
      - extract-version
      - deploy
    uses: ./.github/workflows/_tag-release.yml
    with:
      version: ${{ needs.extract-version.outputs.version }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
