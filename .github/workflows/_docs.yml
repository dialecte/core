name: _docs

on:
  workflow_dispatch:
  workflow_call:

jobs:
  # the docs site builds: a broken page or link is caught before main (deploy-docs.yml publishes it after the merge)
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Build the docs
        run: npm run doc:build
