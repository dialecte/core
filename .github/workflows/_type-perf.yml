# Written by `dialecte ci sync` from the @dialecte/cli template: change the template, not this file.
name: _type-perf

on:
  workflow_dispatch:
  workflow_call:

jobs:
  type-perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          # the install job filled it: a miss stops here, never runs without the locked dependencies
          fail-on-cache-miss: true

      # fails when the type instantiation counts regress past the baseline's tolerance
      - name: Type-performance regression gate
        run: npm run type-bench:check

      # fails when a schema-derived narrowing assertion no longer holds
      - name: Type-narrowing gate
        run: npm run type-narrowing --if-present
