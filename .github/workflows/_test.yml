name: _test

on:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'
          cache: 'npm'

      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Get Playwright Version
        id: playwright-version
        run: echo "playwright_version=$(node -e "console.log(require('./package.json').devDependencies['playwright'])")" >>  $GITHUB_OUTPUT

      - name: Restore Playwright cache
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.playwright_version }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run the node tests
        run: npm run test:node

      # Diagnostic, to remove once the Linux failures are fixed: each test's result as it ends, the two files
      # that fail or hang only on this image run alone first, a hang cut short.
      - name: 'Diagnose: the engine worker suite alone'
        continue-on-error: true
        timeout-minutes: 10
        run: npx vitest run --project browser-all --reporter=verbose src/store/sqlite/runtime/serve-dialecte-engine.test.ts

      - name: 'Diagnose: the store contract alone'
        continue-on-error: true
        timeout-minutes: 15
        run: npx vitest run --project browser-all --reporter=verbose src/store/contract/store-contract.test.ts

      - name: Run the whole suite in the browser
        run: npm run test:browser:all
