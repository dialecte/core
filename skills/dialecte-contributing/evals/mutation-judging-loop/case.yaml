schema_version: '1.1'
name: mutation-judging-loop
expected_outcome: |
  The equality survivor (line 27) is a gap: a test inserting next to a same-tag sibling kills it, then the run is
  repeated. The cache check (line 18) and the log text (line 31) are recorded with `dialecte mutants record --key
  <k> --family <family> --reason "<= 200 chars"` (perf-shortcut, wording). The `rank === -1` branch the type rules
  out is recorded as invariant-guard or fallback-never-taken with `--removable`, plus a named follow-up to delete the
  guard. Nothing is written by hand in `.dialecte/mutation-records.json` or the store under `.git`. `dialecte mutants
  status` shows nothing pending before the hand-over. The judging runs on the standard tier.
