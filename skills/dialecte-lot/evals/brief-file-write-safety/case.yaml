schema_version: '1.1'
name: brief-file-write-safety
expected_outcome: |
  The brief the orchestrator hands to a station, here the test station of a lot that edits existing files, carries the
  file-write safety lines: edit files with the edit tool; a script that rewrites a file reads it fully before opening it
  for writing, never both in one expression (which truncates the file before the read); never run an ad-hoc script that
  writes files with the lot's worktree as its working folder. It still carries the lines every brief has: nothing under
  .git by hand, no multi-agent workflow without opt-in, no rm/mv/xargs on a variable path.
